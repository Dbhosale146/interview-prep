<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline interview Q&A practice for AI/ML engineers." />
    <meta name="theme-color" content="#0B1120" />
    <title>InterviewPrep</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem('interviewprep.theme.v1'));
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* storage unavailable - fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
